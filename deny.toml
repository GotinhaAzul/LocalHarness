[advisories]
version = 2
yanked = "warn"
# serde_yaml is deprecated and pulls unsafe-libyaml, which has no safe
# upgrade. The advisory is unmaintained-only, not a vulnerability; replace
# serde_yaml before lifting this ignore.
ignore = ["RUSTSEC-2024-0449"]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
