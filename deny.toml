[advisories]
version = 2
yanked = "warn"
# Both advisories are unmaintained-only, not vulnerabilities, and have no
# safe upgrade:
# - serde_yaml pulls unsafe-libyaml; replace serde_yaml before lifting this.
# - chrono (RUSTSEC-2026-0543); replace with jiff or time before lifting this.
ignore = ["RUSTSEC-2024-0449", "RUSTSEC-2026-0543"]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
