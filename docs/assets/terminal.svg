<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">LocalHarness terminal UI</title>
  <desc id="desc">A LocalHarness session: reading a parser file, running a failing test, editing the smallest path, and passing verification.</desc>

  <rect width="1200" height="780" fill="#141419"/>

  <!-- Terminal window -->
  <rect x="40" y="30" width="1120" height="720" rx="14" fill="#1b1b1f" stroke="#3f3f46" stroke-width="1.5"/>

  <!-- Title bar -->
  <circle cx="66" cy="54" r="6" fill="#f7768e"/>
  <circle cx="86" cy="54" r="6" fill="#e0af68"/>
  <circle cx="106" cy="54" r="6" fill="#9ece6a"/>
  <text x="128" y="59" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">lh — ~/src/app</text>
  <text x="1136" y="59" text-anchor="end" fill="#565f89" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">coding · qwen3.5-35b-a3b · 12.4k/64k · 19%</text>
  <line x1="40" y1="76" x2="1160" y2="76" stroke="#3f3f46" stroke-width="1"/>

  <!-- User turn -->
  <text x="64" y="108" fill="#7aa2f7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600">You</text>
  <text x="112" y="108" fill="#565f89" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">20:14</text>
  <text x="64" y="136" fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">Fix the flaky parser test and keep the diff small.</text>

  <!-- Assistant turn -->
  <text x="64" y="176" fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600">Assistant</text>
  <text x="64" y="204" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">I’ll reproduce it first, then patch the smallest failing path.</text>

  <!-- read card -->
  <rect x="64" y="224" width="1072" height="48" rx="8" fill="#24283b" stroke="#3f3f46" stroke-width="1"/>
  <text x="84" y="254" fill="#9ece6a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">✓</text>
  <text x="108" y="254" fill="#bb9af7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600">read</text>
  <text x="156" y="254" fill="#c0caf5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">src/parser.rs</text>
  <text x="1116" y="254" text-anchor="end" fill="#565f89" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">12 ms</text>

  <!-- test card -->
  <rect x="64" y="284" width="1072" height="100" rx="8" fill="#24283b" stroke="#3f3f46" stroke-width="1"/>
  <text x="84" y="314" fill="#9ece6a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">✓</text>
  <text x="108" y="314" fill="#bb9af7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600">bash</text>
  <text x="156" y="314" fill="#c0caf5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">cargo test parser</text>
  <text x="1116" y="314" text-anchor="end" fill="#565f89" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">1.8 s</text>
  <text x="84" y="340" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">running 42 tests</text>
  <text x="84" y="362" fill="#f7768e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">FAILED  parser::empty_token</text>
  <text x="392" y="362" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">1 failed; 41 passed</text>

  <!-- edit card -->
  <rect x="64" y="396" width="1072" height="48" rx="8" fill="#24283b" stroke="#3f3f46" stroke-width="1"/>
  <text x="84" y="426" fill="#9ece6a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">✓</text>
  <text x="108" y="426" fill="#bb9af7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600">edit</text>
  <text x="156" y="426" fill="#c0caf5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">src/parser.rs</text>
  <text x="348" y="426" fill="#9ece6a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">+8</text>
  <text x="382" y="426" fill="#f7768e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">−3</text>
  <text x="1116" y="426" text-anchor="end" fill="#565f89" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">LSP clean</text>

  <!-- verify card -->
  <rect x="64" y="456" width="1072" height="64" rx="8" fill="#24283b" stroke="#3f3f46" stroke-width="1"/>
  <text x="84" y="486" fill="#9ece6a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">✓</text>
  <text x="108" y="486" fill="#bb9af7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600">verify</text>
  <text x="180" y="486" fill="#c0caf5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">cargo test</text>
  <text x="1116" y="486" text-anchor="end" fill="#565f89" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">3.1 s</text>
  <text x="84" y="508" fill="#9ece6a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">PASS  cargo  42 passed</text>

  <!-- Final answer -->
  <text x="64" y="560" fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Fixed the empty-token case. One file changed, 42 tests pass.</text>

  <!-- Guard line -->
  <text x="64" y="600" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">✓ read-before-edit   ✓ plan gate   ✓ verify gate   ✓ review gate</text>

  <!-- Input -->
  <rect x="64" y="632" width="1072" height="52" rx="8" fill="#24283b" stroke="#7aa2f7" stroke-width="1.5"/>
  <text x="84" y="664" fill="#7aa2f7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600">&gt;</text>
  <text x="106" y="664" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">type a message…</text>
  <text x="1116" y="664" text-anchor="end" fill="#565f89" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">Enter send  ·  / commands  ·  @ files</text>

  <!-- Status -->
  <text x="64" y="716" fill="#565f89" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">localhost:8080  ·  no telemetry  ·  session 20261110-2014-4242</text>
  <text x="1116" y="716" text-anchor="end" fill="#565f89" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">Ctrl+C cancel  ·  PgUp/PgDn scroll</text>
</svg>
